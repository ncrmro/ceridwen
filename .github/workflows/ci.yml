name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  host-and-cad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv v2
        run: nix profile add github:cachix/devenv/v2.4.0
      - run: make setup
      - run: make check
      - run: devenv shell -- cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: devenv up -d cad
      - name: Browser smoke test
        run: devenv shell -- bash -c 'cd hardware/cad && node node_modules/@playwright/test/cli.js test'
      - name: Build C3 firmware
        run: make build-esp32
      - name: Package iteration artifacts
        run: devenv shell -- python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: ceridwen-provisional-iteration
          path: hardware/cad/out/ceridwen-iteration-package.zip
      - if: always()
        run: devenv down
