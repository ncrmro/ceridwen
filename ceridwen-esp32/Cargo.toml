[package]
name = "ceridwen-esp32"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "ceridwen_esp32"

[dependencies]
ceridwen-core = { path = "../ceridwen-core" }
esp-idf-hal = { version = "0.44", optional = true }
esp-idf-svc = { version = "0.49", optional = true }
esp-idf-sys = { version = "0.35", features = ["binstart"], optional = true }
embedded-svc = { version = "0.28", optional = true }
ssd1306 = { version = "0.9", optional = true }
embedded-graphics = { version = "0.8", optional = true }
embedded-hal = { version = "1.0", optional = true }
anyhow = { version = "1.0", optional = true }
log = { version = "0.4", optional = true }

[build-dependencies]
embuild = { version = "0.32", optional = true }

[features]
default = []
esp32 = [
    "esp-idf-hal",
    "esp-idf-svc",
    "esp-idf-sys",
    "embedded-svc",
    "ssd1306",
    "embedded-graphics",
    "embedded-hal",
    "anyhow",
    "log",
    "embuild",
]

[[bin]]
name = "ceridwen-esp32"
required-features = ["esp32"]

