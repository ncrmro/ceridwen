<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="800" viewBox="0 0 1100 800" role="img" aria-labelledby="title desc">
<title id="title">Ceridwen USB bench wiring</title><desc id="desc">Label-based connection diagram for Teyleten ESP32-C3, Hosyond OLED and two Chanzon switches. Battery connection is not designed.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#172b3a;font-size:17px}.title{font-size:30px;font-weight:700}.head{font-size:21px;font-weight:650}.small{font-size:14px}.wire{fill:none;stroke-width:3}.box{fill:#eef3f5;stroke:#486272;stroke-width:2}.pin{fill:white;stroke:#486272;stroke-width:2}</style>
<rect width="1100" height="800" fill="#fff"/>
<text x="40" y="48" class="title">Ceridwen · USB bench wiring</text>
<text x="40" y="78">Connect by printed labels. Block positions do not show physical pin order.</text>
<rect x="40" y="110" width="1020" height="50" rx="8" fill="#fff2d1"/>
<text x="58" y="140">Unplug USB while wiring. Leave the battery disconnected: its power circuit is unfinished.</text>
<rect class="box" x="60" y="200" width="260" height="320" rx="10"/>
<text x="80" y="235" class="head">U1 · Teyleten C3</text><text x="80" y="260" class="small">USB-C supplies bench power</text>
<rect class="box" x="740" y="200" width="300" height="195" rx="10"/>
<text x="760" y="232" class="head">DISP1 · Hosyond OLED</text>
<text x="760" y="257" class="small">SSD1306 · 128 × 64 · I2C</text>
<g class="wire"><path d="M320 285H740" stroke="#ba303d"/><path d="M320 315H740" stroke="#245eae"/><path d="M320 345H740" stroke="#986900"/><path d="M320 375H740" stroke="#253544"/></g>
<g><text x="262" y="290">3V3</text><text x="760" y="290">VCC</text><text x="252" y="320">GPIO4</text><text x="760" y="320">SDA</text><text x="252" y="350">GPIO5</text><text x="760" y="350">SCL</text><text x="262" y="380">GND</text><text x="760" y="380">GND</text></g>
<g class="small"><text x="420" y="280">W01 · red · 3.3 V</text><text x="420" y="310">W02 · blue · data</text><text x="420" y="340">W03 · yellow · clock</text><text x="420" y="370">W04 · black · common ground</text></g>
<path class="wire" d="M320 440H510M570 440H670V375M320 490H510M570 490H670V440" stroke="#253544"/>
<path class="wire" d="M510 440L559 419M510 490L559 469" stroke="#387b51"/>
<g class="pin"><circle cx="510" cy="440" r="4"/><circle cx="570" cy="440" r="4"/><circle cx="510" cy="490" r="4"/><circle cx="570" cy="490" r="4"/></g>
<g fill="#253544"><circle cx="670" cy="375" r="5"/><circle cx="670" cy="440" r="5"/></g>
<text x="252" y="445">GPIO0</text><text x="252" y="495">GPIO1</text><text x="350" y="434" class="small">W05 · green</text><text x="350" y="484" class="small">W07 · violet</text><text x="583" y="432" class="small">W06</text><text x="583" y="482" class="small">W08</text>
<text x="740" y="440">SW1 · left / previous</text><text x="740" y="490">SW2 · right / next</text><text x="740" y="518" class="small">Chanzon 2-pin normally-open switches</text>
<text x="80" y="554">Internal pull-ups are enabled in firmware. Press both buttons together to select.</text>
<rect x="40" y="580" width="1020" height="175" rx="10" fill="#eef3f5"/>
<text x="60" y="611" class="head">Breadboard placement checks</text>
<text x="60" y="643">1. Verify which five-hole strips and rail sections connect using continuity mode.</text>
<text x="60" y="673">2. Put each switch terminal on a different strip; released = open, pressed = continuity.</text>
<text x="60" y="703">3. Use one verified ground section for W04, W06 and W08. Do not assume split rails connect.</text>
<text x="60" y="733">4. Verify no 3V3–GND short before USB power. Never connect the LiPo directly to 3V3.</text>
<text x="40" y="784" class="small">Revision 2026-10-04 · logical wiring, not a verified breadboard row map · battery and physical acceptance pending</text>
</svg>
